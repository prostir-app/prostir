[package]
name = "prostir-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A fake Prostir headset and a fake PC, for tests and for checking the apps by hand"
# Not published. Besides tests and the probe, the headset app links it for its
# selftest's fake PC, in every build but the store's (feature `selftest`).
publish = false

# Connects like a headset and saves what the PC sends.
[[bin]]
name = "prostir-probe"
path = "src/bin/probe.rs"

# Makes a headset's and a PC's files trust each other, for the headset's selftest
# against a real PC app (scripts/selftest-headset.sh --pc).
[[bin]]
name = "prostir-trust"
path = "src/bin/trust.rs"

[dependencies]
prostir-proto.workspace = true
anyhow.workspace = true
log.workspace = true
# CLOCK_MONOTONIC, which the fake desktop stamps its sound with.
libc.workspace = true

[lints]
workspace = true
