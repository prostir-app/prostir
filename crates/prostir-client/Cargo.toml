[package]
name = "prostir-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Prostir client for headsets with OpenXR on Android: virtual monitors as compositor layers"

[features]
default = ["selftest"]
# The store build: the store's entitlement check, through its SDK loaded at run time
# (for Meta Horizon Store, the Meta Platform SDK; scripts/build-apk.sh with
# PROSTIR_STORE=1, which also turns the selftest off). With `store` the selftest is
# never built, whatever else is on.
store = []
# The selftest against a fake PC in the app's own process (scripts/selftest-headset.sh):
# every build but the store's.
selftest = ["dep:prostir-testkit"]
# The preview build of an unreleased version (scripts/build-apk.sh with
# PROSTIR_PREVIEW=1): the menu's "For development" part, to try how monitors and their
# layers are shown, and its texts. Never with `store` (the build refuses).
preview = ["prostir-lang/preview"]

[lib]
name = "prostir"
crate-type = ["cdylib", "rlib"]

[dependencies]
prostir-proto.workspace = true
prostir-layout.workspace = true
prostir-lang.workspace = true
glam.workspace = true
log.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
# The runtimes' controller models (glTF binaries) are read with it (`model::glb`).
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
libc.workspace = true
openxr = { version = "0.22", features = ["loaded"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-context = "0.1"
ndk-sys = { version = "0.6", features = ["audio"] }
# The same jni as android-activity's: one in the app (CI checks).
jni = "0.22"
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
anyhow.workspace = true
android_logger = "0.15"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The fake PC the selftest runs against, in the app's own process.
prostir-testkit = { workspace = true, optional = true }

[dev-dependencies]
# The shipped selftest clips are checked against the fake PC that plays them.
prostir-testkit.workspace = true
tiny-skia = { version = "0.12", features = ["png-format"] }

[lints]
workspace = true
