[package]
name = "prostir"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Prostir host: virtual KDE Plasma 6 and Hyprland monitors streamed to a Meta Quest 3 or 3S"

[[bin]]
name = "prostir"
path = "src/main.rs"

[features]
default = ["desktop", "count"]
# Counting this PC among Prostir's users, once the person says yes (see src/usage.rs):
# with the key in `count.key`. A distribution that does not want it builds without it
# (`--no-default-features --features desktop`); the settings window then never asks.
count = []
# The real desktops (KDE Plasma, Hyprland): what only they use, so a build with the
# fake desktop has no dependency it does not use.
desktop = [
    "dep:gbm",
    "dep:gstreamer-allocators",
    "dep:ksni",
    "dep:pipewire",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-plasma",
    "dep:wayland-protocols-wlr",
]
# For the end-to-end tests only (crates/prostir/tests/e2e): the platform is a fake desktop in
# memory instead of KDE Plasma or Hyprland (see src/platform/fake). Never in releases.
# It replaces `desktop`, so it is built without the default features: `cargo e2e`
# runs the tests so (`--no-default-features --features fake-desktop`).
fake-desktop = ["dep:gstreamer-base"]

# Started by the end-to-end tests with the fake desktop and driven by a fake headset.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["fake-desktop"]

[dependencies]
prostir-proto.workspace = true
prostir-layout.workspace = true
# The local API's types (JSON), shared with its clients.
prostir-api.workspace = true
# Texts with a count, in the plural form each language needs (Fluent).
prostir-lang.workspace = true
# The settings window (`prostir window`, a process of its own).
prostir-window.workspace = true
anyhow.workspace = true
# A reply for a D-Bus method that waits for the control loop (the local API).
async-channel = "2"
# For the local API only: the headset protocol stays on `Wire`.
serde.workspace = true
clap = { version = "4", features = ["derive"] }
log.workspace = true
env_logger.workspace = true
libc.workspace = true
gstreamer = "0.25"
gstreamer-app = "0.25"
# The fake desktop's picture source (a GStreamer element of its own).
gstreamer-base = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"], optional = true }
zbus.workspace = true
wayland-protocols = { version = "0.32", features = ["client", "unstable"], optional = true }
gbm = { version = "0.18.0", default-features = false, optional = true }
gstreamer-allocators = { version = "0.25", features = ["v1_16"], optional = true }
# KWin's streams read straight from PipeWire (not through `pipewiresrc`), with the
# pointer and the changed parts of the picture that come with each frame.
pipewire = { version = "0.10", features = ["v0_3_33"], optional = true }
serde_json.workspace = true
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }

[dev-dependencies]
prostir-testkit.workspace = true
# The headset app's network code, run against the PC app in the end-to-end tests.
headset = { package = "prostir-client", path = "../prostir-client" }

# Packages built in the release workflow: `cargo deb -p prostir` and
# `cargo generate-rpm -p crates/prostir`, after scripts/package-release.sh (which writes
# build/THIRD-PARTY-LICENSES.txt and builds the program; the release profile strips
# it).
# Same files as scripts/install.sh puts in ~/.local.
#
# Runtime needs: GStreamer with the VA plugin (hardware encoding), x264enc for the CPU
# fallback (NVIDIA, or no VA encoder), pipewiresrc, pulsesrc, h264parse and
# h265parse; pw-cli and pw-loopback; pactl and pacat; kscreen-doctor and qdbus6 on KDE
# Plasma; grim for screenshots on Hyprland (optional). The settings window
# (`prostir window`) loads libEGL, libwayland-client, -cursor and -egl and libxkbcommon
# at run time (the X11 libraries in an X11 session), and the service libwayland-client
# too (its own Wayland connections), so they are listed by hand.
[package.metadata.deb]
name = "prostir"
maintainer = "Prostir contributors <https://github.com/prostir-app/prostir>"
section = "utils"
priority = "optional"
extended-description = """\
Prostir puts extra monitors for a KDE Plasma 6 or Hyprland desktop into a Meta \
Quest 3 or 3S headset. They are real outputs of the desktop, streamed to the headset over the \
local network. This package is the PC part; the headset app comes as an APK from the \
same release."""
depends = "$auto, libegl1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-pipewire, pipewire-bin, pipewire-pulse, pulseaudio-utils, curl"
# "x | hyprland": tools only KDE Plasma needs, so a Hyprland system does not pull them in.
recommends = "mesa-va-drivers | intel-media-va-driver-non-free | intel-media-va-driver, gstreamer1.0-plugins-ugly, kdialog | zenity | fuzzel | wofi | rofi, libnotify-bin, libkscreen-bin | hyprland, qdbus-qt6 | hyprland"
suggests = "adb, grim, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxkbcommon-x11-0, libxrandr2, libxrender1"
assets = [
    ["target/release/prostir", "usr/bin/", "755"],
    ["../../packaging/io.github.prostir_app.Prostir.desktop", "usr/share/applications/", "644"],
    ["../../packaging/prostir.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    # Installed, not enabled: the first start of Prostir enables the socket for its user
    # (and the preset for new users); the tray turns it off for good.
    ["../../packaging/systemd/prostir.socket", "usr/lib/systemd/user/prostir.socket", "644"],
    ["../../packaging/systemd/prostir.service", "usr/lib/systemd/user/prostir.service", "644"],
    ["../../packaging/systemd/80-prostir.preset", "usr/lib/systemd/user-preset/80-prostir.preset", "644"],
    ["../../packaging/udev/70-prostir-quest.rules", "usr/lib/udev/rules.d/70-prostir-quest.rules", "644"],
    ["../../README.md", "usr/share/doc/prostir/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/prostir/LICENSE", "644"],
    ["../../LICENSE-EXCEPTION.md", "usr/share/doc/prostir/LICENSE-EXCEPTION.md", "644"],
    ["../../build/THIRD-PARTY-LICENSES.txt", "usr/share/doc/prostir/THIRD-PARTY-LICENSES.txt", "644"],
]

# Built for Fedora. License files are not marked as documentation, so installs with
# --excludedocs keep them.
[package.metadata.generate-rpm]
name = "prostir"
summary = "Extra KDE Plasma 6 and Hyprland monitors in a Meta Quest 3 or 3S headset"
license = "GPL-3.0-or-later"
# The automatic requirements come from `ldd` on the build machine (Ubuntu in CI), which
# also lists libraries that only that machine's GStreamer and GLib pull in. The direct
# ones are listed by hand below instead.
auto-req = "no"
assets = [
    { source = "target/release/prostir", dest = "/usr/bin/prostir", mode = "755" },
    { source = "../../packaging/io.github.prostir_app.Prostir.desktop", dest = "/usr/share/applications/io.github.prostir_app.Prostir.desktop", mode = "644" },
    { source = "../../packaging/prostir.svg", dest = "/usr/share/icons/hicolor/scalable/apps/prostir.svg", mode = "644" },
    { source = "../../packaging/systemd/prostir.socket", dest = "/usr/lib/systemd/user/prostir.socket", mode = "644" },
    { source = "../../packaging/systemd/prostir.service", dest = "/usr/lib/systemd/user/prostir.service", mode = "644" },
    { source = "../../packaging/systemd/80-prostir.preset", dest = "/usr/lib/systemd/user-preset/80-prostir.preset", mode = "644" },
    { source = "../../packaging/udev/70-prostir-quest.rules", dest = "/usr/lib/udev/rules.d/70-prostir-quest.rules", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/prostir/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/prostir/LICENSE", mode = "644" },
    { source = "../../LICENSE-EXCEPTION.md", dest = "/usr/share/licenses/prostir/LICENSE-EXCEPTION.md", mode = "644" },
    { source = "../../build/THIRD-PARTY-LICENSES.txt", dest = "/usr/share/licenses/prostir/THIRD-PARTY-LICENSES.txt", mode = "644" },
]

[package.metadata.generate-rpm.requires]
glibc = ">= 2.39"
libgcc = "*"
glib2 = "*"
gstreamer1 = "*"
gstreamer1-plugins-base = "*"
gstreamer1-plugins-good = "*"
gstreamer1-plugins-bad-free = "*"
pipewire-gstreamer = "*"
pipewire-libs = "*"
pipewire-utils = "*"
pipewire-pulseaudio = "*"
pulseaudio-utils = "*"
mesa-libgbm = "*"
curl = "*"
libglvnd-egl = "*"
libwayland-client = "*"
libwayland-cursor = "*"
libwayland-egl = "*"
libxkbcommon = "*"

# gstreamer1-plugins-ugly (x264enc) comes from RPM Fusion; without it dnf skips it.
[package.metadata.generate-rpm.recommends]
gstreamer1-plugins-ugly = "*"
libnotify = "*"
qt6-qttools = "*"

[package.metadata.generate-rpm.suggests]
libkscreen = "*"
grim = "*"
kdialog = "*"
zenity = "*"
android-tools = "*"
# The settings window in an X11 session.
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
libXrender = "*"
libxkbcommon-x11 = "*"

[lints]
workspace = true
