[package]
name = "prostir-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Prostir's translations as data: Fluent files built in, more dropped into a folder"
publish = false

[features]
# The texts of the headset's "For development" part (`lang/dev/`), built in only for its
# preview build.
preview = []

[dependencies]
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
# Shortening a name by whole letters (a letter and its accent are one).
unicode-segmentation = "1"
log.workspace = true

[lints]
workspace = true
