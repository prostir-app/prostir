[package]
name = "prostir-window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Prostir settings window (a library of the prostir program): monitors, headsets, sound and look of the PC part"
publish = false

[dependencies]
prostir-lang.workspace = true
# The local API's types, shared with the service (LOCAL-API.md).
prostir-api.workspace = true
# glow: the window needs nothing wgpu adds, and starts faster without it.
# links and clipboard: "Open the releases page" and pasting the pairing code.
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "links", "clipboard"] }
zbus.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "1"
# The font parser egui uses, to check a theme's font before egui gets it.
skrifa = "0.44"
log.workspace = true
env_logger.workspace = true

[dev-dependencies]
# Pictures of every page without a screen: kittest renders with wgpu (lavapipe or the
# graphics card), only in tests.
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[lints]
workspace = true
