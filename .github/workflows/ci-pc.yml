name: CI PC

# The PC part (the program and its settings window) and the shared protocol, when
# either changed.
on:
  push:
    branches: [main, "dev/**"]
    paths:
      - "crates/prostir/**"
      - "crates/prostir-proto/**"
      - "crates/prostir-layout/**"
      - "lang/**"
      - "crates/prostir-api/**"
      - "crates/prostir-testkit/**"
      - "crates/prostir-lang/**"
      - "crates/prostir-window/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-pc.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "crates/prostir/**"
      - "crates/prostir-proto/**"
      - "crates/prostir-layout/**"
      - "lang/**"
      - "crates/prostir-api/**"
      - "crates/prostir-testkit/**"
      - "crates/prostir-lang/**"
      - "crates/prostir-window/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-pc.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc:
    runs-on: ubuntu-24.04
    # A stuck mirror or runner fails the job instead of holding it for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Plugins for the end-to-end tests: the runner has no graphics card, so they encode
      # with x264 (plugins-ugly); h264parse comes from plugins-bad. dbus-daemon gives the
      # tests of the local API a session bus of their own; gst-inspect-1.0 (the tools)
      # scans the plugins once for all of them.
      - uses: ./.github/actions/system-libraries
        with:
          packages: >-
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libclang-dev pkg-config
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-ugly gstreamer1.0-tools dbus-daemon
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -p prostir -p prostir-proto -p prostir-layout -p prostir-api -p prostir-testkit -p prostir-lang -p prostir-window --check
      - run: cargo clippy -p prostir -p prostir-proto -p prostir-layout -p prostir-api -p prostir-testkit -p prostir-lang -p prostir-window --all-targets --locked -- -D warnings
      - run: cargo test -p prostir -p prostir-proto -p prostir-layout -p prostir-api -p prostir-testkit -p prostir-lang --locked
      # The settings window, driven without drawing; its pictures need a graphics card
      # (or lavapipe), which the runner does not have.
      - run: cargo test -p prostir-window --locked --lib --test texts --test window
      # The PC app with the fake desktop, driven by a fake headset (crates/prostir/tests/e2e).
      - name: Clippy with the fake desktop
        run: cargo clippy -p prostir --no-default-features --features fake-desktop --all-targets --locked -- -D warnings
      - name: End-to-end tests
        run: cargo e2e --locked
